name: iOS app

# Builds the SwiftUI app in apps/sylo-ios on a macOS runner, on any branch, only when the app
# (or this workflow) changes. Unsigned simulator build: no certificates or secrets are needed here;
# signing and App Store uploads happen in Xcode (or Xcode Cloud).

on:
  pull_request:
    paths:
      - 'apps/sylo-ios/**'
      - '.github/workflows/ios.yml'
  # Every branch, so a work-in-progress branch gets a build before it has a pull request.
  push:
    paths:
      - 'apps/sylo-ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, arm64, public preview). Images are named after the Xcode
    # major version, not the macOS one; macos-26 only goes up to Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # The project was created with Xcode 27 (project format 90); older Xcodes cannot open it.
      - name: Select Xcode 27
        run: |
          # The newest release; a beta only when the image has no release of Xcode 27 at all.
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          echo "Xcode 27 on this image:"; ls -d /Applications/Xcode_27*.app || true
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for the iOS simulator
        run: |
          xcodebuild build \
            -project apps/sylo-ios/sylo-ios.xcodeproj \
            -target sylo-ios \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
