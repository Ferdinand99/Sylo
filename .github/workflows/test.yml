name: Test

# Runs as a PR/push gate, and is also reusable: called by docker-publish.yml and
# release-please.yml so no image is ever built or published without it passing.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high || true

  test:
    runs-on: ubuntu-latest
    # Runs the suite against both DB drivers: sqlite (today's default, always)
    # and postgres (the opt-in path — see docs/roadmap.md, "Postgres migration
    # line"). GitHub Actions starts the postgres service unconditionally for
    # both matrix legs; it just sits idle on the sqlite leg.
    strategy:
      fail-fast: false
      matrix:
        driver: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: sylo
          POSTGRES_PASSWORD: sylo
          POSTGRES_DB: sylo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # src/config.js requires these and exits without them; the suite only needs
    # them to exist, never to be valid. DB tests redirect DATABASE_PATH to a
    # temp file themselves (see test/helpers/tmpDb.js).
    env:
      DISCORD_TOKEN: ci-placeholder
      DISCORD_CLIENT_ID: "000000000000000000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # pg_dump/pg_restore for db/backupPostgres.js's tests — ubuntu-latest
      # runners usually already carry postgresql-client, but installed
      # explicitly so this doesn't silently start skipping coverage if that
      # ever stops being true.
      - name: Install postgresql-client
        if: matrix.driver == 'postgres'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: ${{ matrix.driver == 'postgres' && 'postgres://sylo:sylo@localhost:5432/sylo_test' || '' }}

      - name: Syntax check every source file
        run: find src scripts test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: EJS templates compile
        run: |
          node -e "
            const fs=require('fs'), path=require('path'), ejs=require('ejs');
            const dir='src/web/views';
            const walk=(d)=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{
              const p=path.join(d,e.name);
              return e.isDirectory()?walk(p):(e.name.endsWith('.ejs')?[p]:[]);
            });
            let bad=0;
            for(const f of walk(dir)){
              try{ ejs.compile(fs.readFileSync(f,'utf8'),{filename:f}); }
              catch(err){ bad++; console.error('FAIL',f,err.message); }
            }
            process.exit(bad?1:0);
          "
