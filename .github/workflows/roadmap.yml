name: Roadmap

# Keeps one Discord message up to date with how far the next release is: the milestone named in the
# repo variable ROADMAP_MILESTONE (default "5.3"). Merged pull requests and closed issues count as
# done; an open pull request with the "tested" label counts for five sixths, one with the
# "ready-for-test" label for four sixths (any label change re-runs it). Every version has
# its own message: its id is the repo variable ROADMAP_MESSAGE_ID_<version> (5.3 -> ROADMAP_MESSAGE_ID_5_3).
# Only a manual run with "post" ticked creates a message (its id is in the job log and the summary);
# every other run only edits the saved one. To start the next version, change ROADMAP_MILESTONE and
# run once with "post" ticked.
on:
  pull_request:
    types: [closed, labeled, unlabeled, milestoned, demilestoned]
  issues:
    types: [closed, reopened, milestoned, demilestoned]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      post:
        description: 'Post a NEW progress message for ROADMAP_MILESTONE (only used when its message id variable is empty)'
        type: boolean
        default: false

permissions:
  issues: read
  pull-requests: read
  contents: read

# One update at a time, so two quick events cannot post the message twice.
concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Update the progress message
        run: node scripts/roadmap.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROADMAP_WEBHOOK_URL: ${{ secrets.ROADMAP_WEBHOOK_URL }}
          ROADMAP_MILESTONE: ${{ vars.ROADMAP_MILESTONE || '5.3' }}
          # The script picks ROADMAP_MESSAGE_ID_<version> out of the repo variables itself.
          ROADMAP_VARS: ${{ toJSON(vars) }}
          # Only a manual run that ticked "post" may create a message; every other run only edits.
          ROADMAP_ALLOW_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.post && 'true' || '' }}
