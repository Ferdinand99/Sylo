version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # One PR for all dev-tool bumps (eslint, prettier, …).
      dev-dependencies:
        dependency-type: development
      # One PR for non-breaking runtime bumps; majors still get their own PR
      # so each can be reviewed on its own.
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # discord.js v15 is not released yet and will be a breaking major
      # (structures/builders split, intents changes). Do it as a dedicated
      # migration once it ships, not an auto-bump.
      - dependency-name: discord.js
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      # One PR for all workflow action bumps.
      actions:
        patterns:
          - '*'
