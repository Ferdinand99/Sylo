name: iOS app

# Builds the SwiftUI app in apps/sylo-ios on a macOS runner, on any branch, only when the app
# (or this workflow) changes. Unsigned simulator build: no certificates or secrets are needed here;
# signing and App Store uploads happen in Xcode (or Xcode Cloud).

on:
  pull_request:
    paths:
      - 'apps/sylo-ios/**'
      - '.github/workflows/ios.yml'
  # Every branch, so a work-in-progress branch gets a build before it has a pull request.
  push:
    paths:
      - 'apps/sylo-ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      appstore:
        description: 'Also produce the App Store screenshots (iPhone 6.9 inch and iPad 13 inch)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, arm64, public preview). Images are named after the Xcode
    # major version, not the macOS one; macos-26 only goes up to Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The project was created with Xcode 27 (project format 90); older Xcodes cannot open it.
      - name: Select Xcode 27
        run: |
          # The newest release; a beta only when the image has no release of Xcode 27 at all.
          # Names like Xcode_27.2.app can be links to a beta (Xcode_27.2_beta_2.app), so filter
          # on the real paths.
          XCODE=$(for x in /Applications/Xcode_27*.app; do realpath "$x"; done 2>/dev/null \
            | grep -viE 'beta|release_candidate' | sort -uV | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          echo "Xcode 27 on this image:"; ls -d /Applications/Xcode_27*.app || true
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # SyloKit (apps/sylo-ios/SyloKit): the app's non-UI code, tested on its own with Swift Testing.
      - name: Test SyloKit
        run: swift test --package-path apps/sylo-ios/SyloKit

      # A scheme, not -target: only a scheme build resolves and builds the SyloKit package the app
      # links. The project has no shared scheme, so xcodebuild uses the one it creates per target.
      - name: Build for the iOS simulator
        run: |
          xcodebuild -list -project apps/sylo-ios/sylo-ios.xcodeproj
          xcodebuild build \
            -project apps/sylo-ios/sylo-ios.xcodeproj \
            -scheme sylo-ios \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      # Screenshots of the main screens, from the Debug build's demo launch arguments (see
      # Previews/DemoLaunch.swift): a made-up Sylo, no server or sign-in needed. Dark and light,
      # plus large text. For checking the design without a Mac; not part of the pass/fail of the build.
      - name: Take screenshots in the simulator
        continue-on-error: true
        timeout-minutes: 40
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/sylo-ios.app"
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro \(" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available | grep -E "iPhone" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulator: $UDID"; xcrun simctl list devices available | grep -E "iPhone" | head -20; xcrun simctl list runtimes
          xcrun simctl boot "$UDID" || true
          echo "Booting..."; date
          xcrun simctl bootstatus "$UDID" -b
          echo "Booted"; date
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          shoot() { # name screen appearance content-size
            xcrun simctl ui "$UDID" appearance "$3"
            xcrun simctl ui "$UDID" content_size "$4"
            xcrun simctl terminate "$UDID" net.opland.sylo >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" net.opland.sylo -SyloDemo YES -SyloDemoScreen "$2"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$OUT/$1.png"
            echo "shot $1"; date
          }
          for mode in dark light; do
            for screen in servers overview modules module tickets thread; do
              shoot "$screen-$mode" "$screen" "$mode" large
            done
          done
          for mode in dark light; do
            for screen in custom-commands insights embeds embed-editor; do
              shoot "$screen-$mode" "$screen" "$mode" large
            done
          done
          # The web-free screens: the appeals list and one appeal, moderation, commands and the audit log.
          for mode in dark light; do
            for screen in appeals appeal moderation commands audit; do
              shoot "$screen-$mode" "$screen" "$mode" large
            done
          done
          shoot appeal-dark-largetext appeal dark accessibility-extra-large
          shoot moderation-dark-largetext moderation dark accessibility-extra-large
          shoot overview-dark-largetext overview dark accessibility-extra-large
          shoot embed-editor-dark-largetext embed-editor dark accessibility-extra-large
          shoot modules-dark-largetext modules dark accessibility-extra-large
          shoot tickets-dark-largetext tickets dark accessibility-extra-large
          shoot servers-dark-largetext servers dark accessibility-extra-large
          ls -la "$OUT"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  # App Store screenshots at the sizes App Store Connect asks for: iPhone 6.9 inch (1320 x 2868) and
  # iPad 13 inch (2064 x 2752), portrait, dark appearance, default text size, clean status bar.
  # Runs on pushes to the redesign branch and on a manual run with `appstore: true`.
  appstore:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/feat/ios-redesign'
      || github.event_name == 'workflow_dispatch' && inputs.appstore
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27
        run: |
          XCODE=$(for x in /Applications/Xcode_27*.app; do realpath "$x"; done 2>/dev/null             | grep -viE 'beta|release_candidate' | sort -uV | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for the iOS simulator
        run: |
          xcodebuild build             -project apps/sylo-ios/sylo-ios.xcodeproj             -scheme sylo-ios             -destination 'generic/platform=iOS Simulator'             -derivedDataPath "$RUNNER_TEMP/dd"             CODE_SIGNING_ALLOWED=NO

      - name: Take the App Store screenshots
        timeout-minutes: 40
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/sylo-ios.app"
          OUT="$RUNNER_TEMP/appstore"
          mkdir -p "$OUT"
          xcrun simctl list devices available
          udid_of() { # name pattern, newest last
            xcrun simctl list devices available | grep -E "$1" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'
          }
          IPHONE=$(udid_of "iPhone [0-9]+ Pro Max \(")
          IPAD=$(udid_of "iPad Pro 13-inch")
          echo "iPhone: $IPHONE  iPad: $IPAD"
          [ -n "$IPHONE" ] && [ -n "$IPAD" ] || { echo "::error::Simulator missing"; exit 1; }

          run_device() { # udid prefix expected-width expected-height
            local UDID="$1" PREFIX="$2" W="$3" H="$4" n=0
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            xcrun simctl ui "$UDID" appearance dark
            xcrun simctl ui "$UDID" content_size large
            xcrun simctl install "$UDID" "$APP"
            for pair in servers:servers overview:overview modules:modules ticket:thread embed-editor:embed-editor appeals:appeals; do
              n=$((n + 1))
              local name="${pair%%:*}" screen="${pair##*:}"
              local file="$OUT/$PREFIX-$(printf '%02d' $n)-$name.png"
              xcrun simctl terminate "$UDID" net.opland.sylo >/dev/null 2>&1 || true
              xcrun simctl launch "$UDID" net.opland.sylo -SyloDemo YES -SyloDemoScreen "$screen"
              sleep 8
              xcrun simctl io "$UDID" screenshot "$file"
              local size
              size="$(sips -g pixelWidth -g pixelHeight "$file" | awk '/pixelWidth/{w=$2} /pixelHeight/{h=$2} END{print w "x" h}')"
              echo "$file $size"
              if [ "$size" != "${W}x${H}" ]; then
                echo "::error::$file is $size, expected ${W}x${H}"; exit 1
              fi
            done
            xcrun simctl shutdown "$UDID" || true
          }
          run_device "$IPHONE" iphone-69 1320 2868
          run_device "$IPAD" ipad-13 2064 2752
          ls -la "$OUT"

      - name: Upload App Store screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appstore-screenshots
          path: ${{ runner.temp }}/appstore
          if-no-files-found: error
