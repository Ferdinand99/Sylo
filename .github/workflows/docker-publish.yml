name: Docker image (main)

# Rolling development image. Every push to main publishes :main and :sha-<short>.
# Stable releases (:latest, :X.Y.Z, :X.Y) are handled by release-please.yml.
# Pull requests build only, to validate the Dockerfile.

on:
  push:
    branches: [main]
    # Docs / template / licence-only commits don't change the image — skip the
    # multi-arch build+push of :main for them. (The pull_request trigger below
    # keeps no filter so a required "validate" check never hangs on a docs PR.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'unraid/**'
      - 'ca_profile.xml'
      - 'LICENSE'
      - 'apps/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Pull requests: prove the image still builds (amd64, native, no push).
  validate:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=main-linux-amd64

  # Push to main / manual run: build each arch on its own native runner (QEMU
  # emulation of arm64 crashes compiling better-sqlite3), push by digest, then
  # merge into one multi-arch tag.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare build vars
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          # GHCR rejects a non-lowercase repository in a canonical reference.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=main-${{ env.PLATFORM_SLUG }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},oci-mediatypes=false,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      # `docker manifest` (not `buildx imagetools`) so the list is a Docker v2
      # manifest list, which Unraid's update check can read.
      - name: Assemble and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euo pipefail
          digests=(*)
          echo "Per-arch digests: ${digests[*]}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sources=()
          for d in "${digests[@]}"; do sources+=("${image}@sha256:${d}"); done
          while IFS= read -r tag; do
            echo "==> $tag"
            docker manifest rm "$tag" >/dev/null 2>&1 || true
            docker manifest create "$tag" "${sources[@]}"
            docker manifest push "$tag"
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
