<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Browser chrome / status bar colour = the topbar background (--bg-main).
         Dark is the default; /v2/theme.js (public/theme.js) and Shell.jsx switch it
         for the light theme. -->
    <meta name="theme-color" content="#0b0b0d" />
    <title>Sylo — Dashboard</title>
    <!-- The Sylo starling, served by the dashboard at / (src/web/public). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <script src="/v2/theme.js"></script>
    <!-- Error reports and visit counts (src/web/routes/telemetry.js); a no-op unless configured. -->
    <script src="/telemetry.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
