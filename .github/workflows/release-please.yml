name: Release

on:
  push:
    branches: [main]
  # Manual re-publish: build and push images for a tag that already exists
  # (e.g. a release whose image job failed). Skips release-please entirely.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build & publish images for (e.g. v3.3.0)
        required: true
        type: string

# Least privilege by default; jobs opt into what they need.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains a "release PR" from Conventional Commits. Merging that PR tags the
  # commit, publishes a GitHub Release, and updates package.json + CHANGELOG.md.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Test gate for the release image (the release PR itself is not run through
  # PR checks because it is opened with GITHUB_TOKEN).
  test:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Decide which tag the image build should use, and whether it runs at all:
  # a freshly merged release PR, or a manual re-publish.
  resolve:
    needs: [release-please, test]
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.release-please.outputs.release_created == 'true' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            raw="$DISPATCH_TAG"
          else
            raw="$RELEASE_TAG"
          fi
          raw="$(echo "$raw" | tr -d '[:space:]')"
          if [ -z "$raw" ]; then
            echo "::error::No tag to build (dispatch input empty / no release created)."
            exit 1
          fi
          # Accept "3.3.0" or "v3.3.0"; the git tags are v-prefixed.
          tag="v${raw#v}"
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} does not exist in this repository."
            exit 1
          fi
          echo "Resolved image tag: ${tag} (ref refs/tags/${tag})"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/${tag}" >> "$GITHUB_OUTPUT"

  # Build each architecture on its own native runner. QEMU emulation of arm64
  # crashes compiling better-sqlite3 (musl has no prebuilt binary), so amd64
  # runs on ubuntu-latest and arm64 on the GitHub-hosted ARM runner. Each leg
  # pushes by digest only; the merge job assembles the tagged manifest list.
  build:
    needs: resolve
    # resolve uses if: always(), so downstream jobs need an explicit status
    # check or GitHub skips them.
    if: always() && needs.resolve.result == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare build vars
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          # GHCR rejects a non-lowercase repository in a canonical reference.
          echo "DH_IMAGE=docker.io/${{ vars.DOCKERHUB_USERNAME }}/sylo" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/sylo
            ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_SLUG }}
          provenance: false
          # Docker (schema 2) manifests, not OCI — Unraid's "check for updates"
          # can't parse OCI media types. push-by-digest: no tag here, the merge
          # job applies :latest / :X.Y.Z / :X.Y to the assembled list.
          outputs: type=image,"name=${{ env.DH_IMAGE }},${{ env.GHCR_IMAGE }}",oci-mediatypes=false,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch tag on both registries.
  # `docker manifest` (not `buildx imagetools`) so the list is a Docker v2
  # manifest list, which Unraid's update check can read.
  merge:
    needs: [resolve, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/sylo
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}

      - name: Assemble and push manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          digests=(*)
          echo "Per-arch digests: ${digests[*]}"
          for image in "docker.io/${DOCKERHUB_USERNAME}/sylo" "ghcr.io/${GITHUB_REPOSITORY,,}"; do
            sources=()
            for d in "${digests[@]}"; do sources+=("${image}@sha256:${d}"); done
            while IFS= read -r tag; do
              echo "==> $tag"
              docker manifest rm "$tag" >/dev/null 2>&1 || true
              docker manifest create "$tag" "${sources[@]}"
              docker manifest push "$tag"
            done < <(jq -r --arg img "$image" '.tags[] | select(startswith($img + ":"))' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          done
