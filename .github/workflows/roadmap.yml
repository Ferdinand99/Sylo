name: Roadmap

# Keeps Discord messages up to date with how far the next releases are: one message per milestone in
# the repo variable ROADMAP_MILESTONE, a comma-separated list (for example "5.3, iOS 1.3"; default
# "5.3"). Merged pull requests and closed issues count as done; an open pull request with the "tested"
# label counts for five sixths, one with the "ready-for-test" label for four sixths (any label change
# re-runs it). Every milestone has its own message: its id is the repo variable
# ROADMAP_MESSAGE_ID_<slug> (5.3 -> ROADMAP_MESSAGE_ID_5_3, iOS 1.3 -> ROADMAP_MESSAGE_ID_IOS_1_3).
# The milestones are updated in turn; one failing does not stop the others, but the run then fails.
# Only a manual run with "post" ticked creates a message (its id is in the job log and the summary),
# and only for a milestone whose id variable is empty; an existing message is only ever edited. Every
# other run only edits the saved messages. To start a new milestone, add it to ROADMAP_MILESTONE and run
# once with "post" ticked and "milestone" set to its title.
on:
  pull_request:
    types: [closed, labeled, unlabeled, milestoned, demilestoned]
  issues:
    types: [closed, reopened, milestoned, demilestoned]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      post:
        description: 'Post a NEW progress message (only for milestones whose message id variable is empty; existing messages are just edited)'
        type: boolean
        default: false
      milestone:
        description: 'Only handle this one milestone (for example "iOS 1.3"); empty = every milestone in ROADMAP_MILESTONE'
        type: string
        default: ''

permissions:
  issues: read
  pull-requests: read
  contents: read

# One update at a time, so two quick events cannot post the message twice.
concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Update the progress message
        run: node scripts/roadmap.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROADMAP_WEBHOOK_URL: ${{ secrets.ROADMAP_WEBHOOK_URL }}
          # A manual run can name one milestone; otherwise every milestone in the repo variable is updated.
          ROADMAP_MILESTONE: ${{ github.event_name == 'workflow_dispatch' && inputs.milestone || vars.ROADMAP_MILESTONE || '5.3' }}
          # The script picks ROADMAP_MESSAGE_ID_<slug> out of the repo variables itself.
          ROADMAP_VARS: ${{ toJSON(vars) }}
          # Only a manual run that ticked "post" may create a message, and only for a milestone without a
          # saved id (the script edits whenever an id is saved, so a message is never posted twice).
          ROADMAP_ALLOW_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.post && 'true' || '' }}
